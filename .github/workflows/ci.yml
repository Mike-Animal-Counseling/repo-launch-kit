name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Package skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build and verify release ZIP
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/repo-launch-kit.zip
        run: |
          git archive --format=zip --prefix=repo-launch-kit/ -o "$ARCHIVE" HEAD:skills/repo-launch-kit
          test -s "$ARCHIVE"

          install_dir=$(mktemp -d "$(dirname "$ARCHIVE")/repo-launch-kit-install.XXXXXX")
          trap 'rm -rf -- "$install_dir"' EXIT
          unzip -q "$ARCHIVE" -d "$install_dir"
          skill_dir="$install_dir/repo-launch-kit"
          test -f "$skill_dir/SKILL.md"
          test -f "$skill_dir/agents/openai.yaml"
          git show HEAD:LICENSE | cmp - "$skill_dir/LICENSE"
          git show HEAD:.github/pull_request_template.md | cmp - "$skill_dir/assets/pull_request_template.md"

          for path in assets/AGENTS.md assets/TODO.md assets/pull_request_template.md references/github-ci.md; do
            if ! test -f "$skill_dir/$path" || ! grep -Fq -- "]($path)" "$skill_dir/SKILL.md"; then
              printf 'Installed SKILL.md must link to packaged file %s\n' "$path" >&2
              exit 1
            fi
          done
